[project]
name = "aegis-mcp"
version = "1.0.0"
description = "Model Context Protocol server exposing Aegis AI assurance tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aegis-ai", "mcp>=1.2"]

[project.scripts]
aegis-mcp = "aegis_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aegis_mcp"]
