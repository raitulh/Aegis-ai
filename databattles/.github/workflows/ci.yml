name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: databattles
          POSTGRES_PASSWORD: databattles
          POSTGRES_DB: databattles_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U databattles" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://databattles:databattles@localhost:5432/databattles_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest
      - name: Migrations are in sync with models
        env:
          DATABASE_URL: postgresql+psycopg://databattles:databattles@localhost:5432/databattles_test
        run: alembic upgrade head && alembic check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    needs: [backend, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: databattles
          POSTGRES_PASSWORD: databattles
          POSTGRES_DB: databattles
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U databattles" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://databattles:databattles@localhost:5432/databattles
      ENV: development
      DEMO_MODE: "true"
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Backend
        working-directory: backend
        run: |
          pip install -r requirements.lock
          alembic upgrade head
          python -m app.seed
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          nohup python -m app.worker > ../worker.log 2>&1 &
      - name: Web
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npm run start > ../web.log 2>&1 &
          npx wait-on http://localhost:3000 http://localhost:8000/healthz --timeout 60000
          npx playwright test
      - if: failure()
        run: tail -n 200 api.log worker.log web.log
