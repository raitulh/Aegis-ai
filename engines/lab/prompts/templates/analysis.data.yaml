name: analysis.data
version: "1.0.0"
task_type: result_analysis
role: data_analyst
description: Inspect measured results for anomalies.
variables: [results]
template: |
  Role: DataAnalystAgent. Measured results (from the platform, not self-reported): {{results}}
  Report observations, anomalies (outliers, suspicious zero variance, metric values outside plausible
  ranges, seeds that disagree) and checks a human should run. Do not reinterpret the verdicts.
