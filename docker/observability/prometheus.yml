# ==============================================================================
# Prometheus — docker-compose `observability` profile.
#
# Scrapes every Aegis process that exposes Prometheus metrics on the compose
# network. Metric names come from apps/api/aegis_api/lab/observability/metrics.py
# (bounded label cardinality: no tenant/user ids).
#
# When METRICS_TOKEN is set, the API's /metrics requires `Authorization: Bearer
# <token>`. Prometheus does not expand environment variables in this file, so the
# compose service writes METRICS_TOKEN to /tmp/metrics-token (private tmpfs) at
# start-up and the aegis-api job reads it via credentials_file. An empty file
# (token unset, the dev default) sends an empty bearer, which the API ignores
# when no token is configured. Worker metric ports are unauthenticated and are
# only reachable on the compose network.
# ==============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    stack: aegis-local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI app: HTTP, DB, LLM, agent, approvals, SSE metrics (GET /metrics).
  - job_name: aegis-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  # Lab background processes: each serves its own registry on METRICS_PORT.
  - job_name: aegis-event-consumer
    static_configs:
      - targets: ["event-consumer:9102"]
        labels:
          service: event-consumer

  - job_name: aegis-scheduler
    static_configs:
      - targets: ["scheduler:9103"]
        labels:
          service: scheduler

  # Temporal workers (workflow/activity durations, LLM + compute metrics recorded
  # inside activities). Targets report down until the worker process serves
  # METRICS_PORT.
  - job_name: aegis-temporal-worker
    static_configs:
      - targets: ["temporal-worker:9104"]
        labels:
          service: temporal-worker
          queue: default

  - job_name: aegis-execution-worker
    static_configs:
      - targets: ["execution-worker:9105"]
        labels:
          service: execution-worker
          queue: execution

  # Temporal server internals (PROMETHEUS_ENDPOINT on the temporal service).
  - job_name: temporal-server
    static_configs:
      - targets: ["temporal:8000"]
        labels:
          service: temporal

  # Collector self-telemetry and metrics received over OTLP / derived from spans.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          service: otel-collector-internal
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector-exported
