# OpenTelemetry Collector for local development: receives OTLP traces/metrics from the API and workers
# (set OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 — the app exports OTLP/HTTP) and logs them. Point `exporters` at your
# tracing backend (Tempo, Jaeger, a vendor) for real deployments.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Defence in depth: drop attributes that could carry credentials even though the app redacts them.
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/redact, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
