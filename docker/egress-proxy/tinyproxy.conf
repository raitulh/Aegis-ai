# ==============================================================================
# Sandbox egress proxy (tinyproxy 1.11) — docker-compose `egress-proxy` service.
#
# Experiment containers started by the execution worker in network mode
# "allowlist" join the internal Docker network `aegis-sandbox-egress`, which has
# NO route to the outside world. Their only way out is this proxy (HTTP_PROXY /
# HTTPS_PROXY are injected by the sandbox builder), and the proxy only forwards
# to the domains listed in allowlist.txt. Everything else is denied.
#
# Limits of this design (documented, not hidden):
#   * The allowlist is deployment-wide. Per-job host lists are validated by the
#     API at submission time (subset of the org + TOOL_EGRESS_ALLOWLIST), but the
#     proxy enforces only this file — keep it no broader than TOOL_EGRESS_ALLOWLIST.
#   * Domain filtering cannot stop an allowlisted domain from resolving to a
#     private address (DNS rebinding); only allowlist domains you trust.
#   * HTTPS is tunnelled (CONNECT), not inspected.
# ==============================================================================

Port 8888
# IPv4 only (container networks here are IPv4; avoids a failed IPv6 bind at startup).
Listen 0.0.0.0
Timeout 120
MaxClients 50

# The container runs as an unprivileged user (image default); no User/Group switch needed.
# Log to stdout/stderr (no LogFile, no Syslog); "Connect" logs every CONNECT for auditability.
LogLevel Connect

# Do not leak proxy identity or client addresses upstream.
DisableViaHeader Yes
XTinyproxy No

# Accept clients from private container networks only (the proxy is attached to
# the internal sandbox network and to its own outbound network — nothing else).
# 127.0.0.1 is the container's own healthcheck (a request to a non-allowlisted
# host that must come back "403 Filtered" — i.e. the proxy is up AND default-deny).
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# HTTPS tunnels to port 443 only (no CONNECT to arbitrary ports, e.g. SMTP/SSH).
ConnectPort 443

# Domain allowlist: default-deny, match on the host name only (not the full URL),
# shell-style patterns ("*.example.org" does not match the apex "example.org" —
# list both), case-insensitive. allowlist.txt: one pattern per line, no comments.
# Keep it in sync with (and no broader than) TOOL_EGRESS_ALLOWLIST.
Filter "/etc/tinyproxy/allowlist.txt"
FilterType fnmatch
FilterURLs Off
FilterCaseSensitive Off
FilterDefaultDeny Yes
