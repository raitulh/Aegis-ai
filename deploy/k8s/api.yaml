# API: stateless, horizontally scaled, never executes generated code (no Kubernetes token, no sandbox access).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-api
  namespace: aegis
  labels: {app.kubernetes.io/name: aegis-api, app.kubernetes.io/part-of: aegis}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: aegis-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: aegis-api, app.kubernetes.io/part-of: aegis, aegis.io/tier: api}
    spec:
      serviceAccountName: aegis-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: aegis-api}
      containers:
        - name: api
          image: aegis-api:latest
          command: ["uvicorn", "aegis_api.app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: aegis-config}
            - secretRef: {name: aegis-secrets}
          env:
            - {name: EXECUTION_BACKEND, value: disabled}   # the API never runs generated code
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: var, mountPath: /app/var}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 512Mi}}
        - {name: var, emptyDir: {sizeLimit: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-api
  namespace: aegis
spec:
  selector: {app.kubernetes.io/name: aegis-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aegis-api
  namespace: aegis
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: aegis-api}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aegis-api
  namespace: aegis
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: aegis-api}
