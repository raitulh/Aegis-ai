# One ServiceAccount per workload. None of them talks to the Kubernetes API except the execution
# worker, so every other account has automountServiceAccountToken: false (no token in the pod at all).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-api
  namespace: aegis
  labels: {app.kubernetes.io/part-of: aegis, app.kubernetes.io/name: aegis-api}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-worker
  namespace: aegis
  labels: {app.kubernetes.io/part-of: aegis, app.kubernetes.io/name: aegis-worker}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-temporal-worker
  namespace: aegis
  labels: {app.kubernetes.io/part-of: aegis, app.kubernetes.io/name: aegis-temporal-worker}
automountServiceAccountToken: false
---
# The ONLY account with API access: it may manage Jobs/Pods in aegis-sandbox (rbac-execution.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-execution-worker
  namespace: aegis
  labels: {app.kubernetes.io/part-of: aegis, app.kubernetes.io/name: aegis-execution-worker}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-scheduler
  namespace: aegis
  labels: {app.kubernetes.io/part-of: aegis, app.kubernetes.io/name: aegis-scheduler}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-event-consumer
  namespace: aegis
  labels: {app.kubernetes.io/part-of: aegis, app.kubernetes.io/name: aegis-event-consumer}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-migrate
  namespace: aegis
  labels: {app.kubernetes.io/part-of: aegis, app.kubernetes.io/name: aegis-migrate}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-egress-proxy
  namespace: aegis
  labels: {app.kubernetes.io/part-of: aegis, app.kubernetes.io/name: aegis-egress-proxy}
automountServiceAccountToken: false
---
# Sandbox Jobs run as the namespace's default account (the Job builder sets no serviceAccountName and
# automountServiceAccountToken: false on the pod). Disable token automount on the account as well so
# no pod in this namespace can ever receive an API credential by accident.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: aegis-sandbox
  labels: {app.kubernetes.io/part-of: aegis}
automountServiceAccountToken: false
