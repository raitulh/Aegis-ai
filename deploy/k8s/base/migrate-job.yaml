# Aegis workload. Keep the security context, env and probe blocks consistent with the other workloads in base/.
# One-shot schema migration (alembic upgrade head via docker/init.sh; demo seeds off). Run it before
# rolling out a new image. Job templates are immutable, so the finished Job is garbage-collected after
# ttlSecondsAfterFinished and re-created on the next apply. With Argo CD it runs as a PreSync hook.
apiVersion: batch/v1
kind: Job
metadata:
  name: aegis-migrate
  namespace: aegis
  labels:
    app.kubernetes.io/name: aegis-migrate
    app.kubernetes.io/part-of: aegis
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-migrate
        app.kubernetes.io/part-of: aegis
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: aegis-migrate
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: aegis-api
          imagePullPolicy: IfNotPresent
          args: ["bash", "docker/init.sh"]
          envFrom:
            - configMapRef:
                name: aegis-config
          env:
            - name: OTEL_SERVICE_NAME
              value: "aegis-migrate"
            - name: DEMO_SEED_ON_INIT
              value: "false"
            - name: LAB_DEMO_SEED_ON_INIT
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: DATABASE_URL}
            - name: DATABASE_ADMIN_URL
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: DATABASE_ADMIN_URL}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: REDIS_URL}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: JWT_SECRET}
            - name: SECRETS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: SECRETS_ENCRYPTION_KEY}
            - name: API_KEY_PEPPER
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: API_KEY_PEPPER}
            - name: OBJECT_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: OBJECT_STORAGE_ACCESS_KEY}
            - name: OBJECT_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: OBJECT_STORAGE_SECRET_KEY}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: var
              mountPath: /app/var
      volumes:
        # Writable scratch space: the root filesystem is read-only.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: var
          emptyDir:
            sizeLimit: 1Gi
