# Aegis workload. Keep the security context, env and probe blocks consistent with the other workloads in base/.
# Temporal worker, default task queue (missions, agents, research, evaluation, …).
# Never executes experiment code. SIGTERM drains in-flight activities (terminationGracePeriodSeconds).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-temporal-worker
  namespace: aegis
  labels:
    app.kubernetes.io/name: aegis-temporal-worker
    app.kubernetes.io/part-of: aegis
    app.kubernetes.io/component: temporal-worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-temporal-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-temporal-worker
        app.kubernetes.io/part-of: aegis
        app.kubernetes.io/component: temporal-worker
    spec:
      serviceAccountName: aegis-temporal-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal-worker
          image: aegis-api
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "aegis_api.lab.workflows.worker", "--queues", "default"]
          envFrom:
            - configMapRef:
                name: aegis-config
          env:
            - name: OTEL_SERVICE_NAME
              value: "aegis-temporal"
            - name: METRICS_PORT
              value: "9104"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: DATABASE_URL}
            - name: DATABASE_ADMIN_URL
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: DATABASE_ADMIN_URL}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: REDIS_URL}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: JWT_SECRET}
            - name: SECRETS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: SECRETS_ENCRYPTION_KEY}
            - name: API_KEY_PEPPER
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: API_KEY_PEPPER}
            - name: OBJECT_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: OBJECT_STORAGE_ACCESS_KEY}
            - name: OBJECT_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: OBJECT_STORAGE_SECRET_KEY}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: GEMINI_API_KEY, optional: true}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: OPENAI_API_KEY, optional: true}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: ANTHROPIC_API_KEY, optional: true}
            - name: TEMPORAL_API_KEY
              valueFrom:
                secretKeyRef: {name: aegis-secrets, key: TEMPORAL_API_KEY, optional: true}
          ports:
            - name: metrics
              containerPort: 9104
              protocol: TCP
          startupProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: var
              mountPath: /app/var
      volumes:
        # Writable scratch space: the root filesystem is read-only.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: var
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-temporal-worker-metrics
  namespace: aegis
  labels:
    app.kubernetes.io/name: aegis-temporal-worker
    app.kubernetes.io/part-of: aegis
    aegis.io/metrics: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aegis-temporal-worker
  ports:
    - name: metrics
      port: 9104
      targetPort: metrics
      protocol: TCP
---
# Placeholder: scale default-queue workers on CPU. Better signal: Temporal task-queue backlog
# (e.g. KEDA's Temporal scaler) once available in your cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aegis-temporal-worker
  namespace: aegis
  labels: {app.kubernetes.io/name: aegis-temporal-worker, app.kubernetes.io/part-of: aegis}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aegis-temporal-worker
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
