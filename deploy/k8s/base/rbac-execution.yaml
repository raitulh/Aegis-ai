# RBAC for the execution worker (KubernetesBackend, apps/api/aegis_api/lab/execution/backends/kubernetes.py).
# Namespaced to aegis-sandbox and limited to what the backend does:
#   jobs      create (submit), get/list/watch (poll, re-attach after restart), delete (cancel/cleanup)
#   pods      get/list/watch (status, exit code, OOM), delete (orphan cleanup)
#   pods/log  get (bounded log retrieval)
# Nothing else: no secrets, configmaps, services, exec/attach/portforward, no cluster-scoped access, no
# access to the aegis namespace. Pods are only ever created by the Job controller.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aegis-execution-worker
  namespace: aegis-sandbox
  labels: {app.kubernetes.io/part-of: aegis, app.kubernetes.io/name: aegis-execution-worker}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aegis-execution-worker
  namespace: aegis-sandbox
  labels: {app.kubernetes.io/part-of: aegis, app.kubernetes.io/name: aegis-execution-worker}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aegis-execution-worker
subjects:
  - kind: ServiceAccount
    name: aegis-execution-worker
    namespace: aegis
