# Namespaces.
#   aegis          — the platform (API, workers, scheduler, event consumer, egress proxy)
#   aegis-sandbox  — ONLY untrusted experiment Jobs created by the execution worker. Nothing else runs
#                    here: default-deny networking, a ResourceQuota and no service-account tokens.
# Both enforce the Pod Security "restricted" profile (non-root, no privilege escalation, all caps dropped,
# RuntimeDefault seccomp); the sandbox Job builder (engines/lab/sandbox.py) produces compliant pods.
apiVersion: v1
kind: Namespace
metadata:
  name: aegis
  labels:
    app.kubernetes.io/part-of: aegis
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: aegis-sandbox
  labels:
    app.kubernetes.io/part-of: aegis
    aegis.io/sandbox: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
