# gVisor runtime for sandbox Jobs (KUBERNETES_RUNTIME_CLASS=gvisor). Requires runsc on the sandbox node pool
# (e.g. GKE Sandbox, or containerd configured with the runsc shim). Remove KUBERNETES_RUNTIME_CLASS if your
# cluster cannot provide it — isolation then relies on the pod security context and network policy alone.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
scheduling:
  nodeSelector:
    aegis.io/sandbox-pool: "true"
  tolerations:
    - key: aegis.io/sandbox
      operator: Exists
      effect: NoSchedule
