# Optional: GPU node pool for sandbox Jobs. GPUs stay off unless ALL of these hold:
#   EXECUTION_GPU_ENABLED=true, the org execution policy enables GPUs, and FEATURE_GPU_EXECUTION is on.
#
# 1. Create a GPU node pool with the NVIDIA device plugin, then label and taint its nodes so ONLY GPU
#    sandbox Jobs land there (the Job builder adds this nodeSelector and toleration automatically):
#      kubectl label node <gpu-node> aegis.io/gpu-type=nvidia-l4
#      kubectl taint node <gpu-node> nvidia.com/gpu=present:NoSchedule
#    (managed clusters: set the same label/taint on the node pool instead).
# 2. Raise the sandbox GPU quota (base/sandbox-quota.yaml sets it to 0) in your overlay:
#      patches:
#        - target: {kind: ResourceQuota, name: sandbox-quota}
#          patch: |-
#            - op: replace
#              path: /spec/hard/requests.nvidia.com~1gpu
#              value: "4"
#    and set EXECUTION_GPU_ENABLED: "true" in the aegis-config patch.
# 3. Price GPUs for cost reporting: EXECUTION_GPU_PRICE_PER_HOUR_JSON='{"nvidia-l4": 0.80}' (verify).
#
# The Job below only illustrates what the execution worker creates for a GPU run (see
# engines/lab/sandbox.py build_k8s_job) — sandbox Jobs are created by the platform, never by hand.
apiVersion: batch/v1
kind: Job
metadata:
  name: example-gpu-sandbox
  namespace: aegis-sandbox
  labels:
    app.kubernetes.io/component: sandbox
    app.kubernetes.io/managed-by: aegis-lab
    aegis.io/network: none
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: sandbox
        app.kubernetes.io/managed-by: aegis-lab
        aegis.io/network: none
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      runtimeClassName: gvisor          # only if the gVisor RuntimeClass supports GPUs on your nodes
      nodeSelector:
        aegis.io/gpu-type: nvidia-l4
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: main
          image: python:3.12-slim
          command: ["python", "-c", "print('gpu sandbox placeholder')"]
          resources:
            requests: {cpu: "2", memory: 8Gi, ephemeral-storage: 10Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "2", memory: 8Gi, ephemeral-storage: 10Gi, nvidia.com/gpu: "1"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: workspace
          emptyDir: {sizeLimit: 10Gi}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
