# The Secret every Aegis workload reads (secretKeyRef, name "aegis-secrets", namespace aegis). It is
# managed OUTSIDE git. Example with the External Secrets Operator (external-secrets.io); any mechanism
# that produces a Secret with these keys works (Sealed Secrets, Vault Agent, CSI Secrets Store, …).
#
# Required keys (the app refuses to start in production without the starred ones):
#   DATABASE_URL            app role (RLS enforced), e.g. postgresql://aegis:…@db:5432/aegis?sslmode=require
#   DATABASE_ADMIN_URL      owner role for migrations / identity / cross-tenant maintenance
#   REDIS_URL               e.g. rediss://:…@redis:6379/0
#   JWT_SECRET *            HS256 signing key (rotate with JWT_SECRETS_JSON + JWT_ACTIVE_KID)
#   SECRETS_ENCRYPTION_KEY *  Fernet key
#   API_KEY_PEPPER *        API-key hashing pepper (also derives signed-URL / agent-message HMAC keys)
#   OBJECT_STORAGE_ACCESS_KEY *, OBJECT_STORAGE_SECRET_KEY *   bucket-scoped credentials (not root)
# Optional keys: GEMINI_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY, METRICS_TOKEN, TEMPORAL_API_KEY
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aegis-secrets
  namespace: aegis
  labels: {app.kubernetes.io/part-of: aegis}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets          # PLACEHOLDER: your secret store
  target:
    name: aegis-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    # One secret-manager entry holding a JSON object with the keys listed above.
    - extract:
        key: aegis/production       # PLACEHOLDER: path in your secret manager
