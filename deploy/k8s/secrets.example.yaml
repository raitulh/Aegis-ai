# EXAMPLE ONLY — not part of kustomization.yaml. Create the real Secret from your secret manager
# (External Secrets Operator, Sealed Secrets, CSI driver ...). Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: aegis-secrets
  namespace: aegis
type: Opaque
stringData:
  DATABASE_URL: postgresql://aegis:CHANGE_ME@postgres.aegis.svc:5432/aegis          # RLS-enforced app role
  DATABASE_ADMIN_URL: postgresql://postgres:CHANGE_ME@postgres.aegis.svc:5432/aegis # migrations/identity only
  REDIS_URL: redis://redis.aegis.svc:6379/0
  SECRETS_ENCRYPTION_KEY: CHANGE_ME        # Fernet key
  API_KEY_PEPPER: CHANGE_ME
  JWT_SIGNING_KEY: CHANGE_ME_AT_LEAST_32_CHARACTERS
  AGENT_MESSAGE_SIGNING_KEY: CHANGE_ME
  OBJECT_STORAGE_ACCESS_KEY: CHANGE_ME
  OBJECT_STORAGE_SECRET_KEY: CHANGE_ME
  GEMINI_API_KEY: ""
  METRICS_TOKEN: CHANGE_ME
